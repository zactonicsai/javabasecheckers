<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Java 25 + Spring Boot 4 Demo</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f4f7fb; color: #172033; }
    main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    header { background: #0f62fe; color: white; padding: 28px; border-radius: 18px; box-shadow: 0 10px 30px rgba(15, 98, 254, .25); }
    h1 { margin: 0 0 8px; }
    button { border: 0; border-radius: 10px; padding: 10px 14px; background: #0f62fe; color: white; cursor: pointer; font-weight: 700; }
    button:hover { filter: brightness(.95); }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #dce3ee; border-radius: 14px; padding: 18px; box-shadow: 0 4px 18px rgba(0, 0, 0, .06); }
    .status { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #defbe6; color: #044317; font-size: 12px; font-weight: 700; }
    pre { overflow: auto; background: #172033; color: #f4f7fb; padding: 16px; border-radius: 12px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      .card { background: #1f2937; border-color: #374151; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Java 25 + Spring Boot 4</h1>
    <p>Static HTML page calling a simple JSON API.</p>
  </header>

  <section class="toolbar">
    <button type="button" onclick="loadMessages()">Load API Data</button>
    <button type="button" onclick="loadHealth()">Check Health</button>
  </section>

  <section id="cards" class="grid" aria-live="polite"></section>

  <h2>Try these commands</h2>
  <pre>mvn clean verify
mvn spring-boot:run</pre>

  <p>Reports after verify:</p>
  <ul>
    <li>JaCoCo: <code>target/site/jacoco/index.html</code></li>
    <li>SpotBugs: <code>target/spotbugs.html</code></li>
    <li>Checkstyle: console output and <code>target/checkstyle-result.xml</code></li>
  </ul>
</main>

<script>
  function renderCards(items) {
    const cards = document.getElementById('cards');
    cards.innerHTML = '';
    items.forEach((item) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <span class="status">${item.status}</span>
        <h2>${item.title}</h2>
        <p>${item.message}</p>
      `;
      cards.appendChild(card);
    });
  }

  async function loadMessages() {
    const response = await fetch('/api/messages');
    if (!response.ok) throw new Error('API request failed');
    renderCards(await response.json());
  }

  async function loadHealth() {
    const response = await fetch('/api/health');
    if (!response.ok) throw new Error('Health request failed');
    renderCards([await response.json()]);
  }

  loadMessages().catch((error) => {
    renderCards([{ title: 'Error', message: error.message, status: 'DOWN' }]);
  });
</script>
</body>
</html>
